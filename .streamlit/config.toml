# Streamlit's file watcher walks every installed package on each rerun. With
# transformers installed that means thousands of spurious "No module named
# 'torchvision'" tracebacks in the Cloud logs, because it touches lazy vision
# modules whose optional dependency is not installed. The app has no need to
# hot-reload third-party packages.
[server]
fileWatcherType = "none"

[logger]
level = "info"
